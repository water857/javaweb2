<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 智能社区服务平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-house-door"></i> 智能社区服务平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">社区服务</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">邻里互动</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">社区活动</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-speedometer2"></i> 用户中心</a></li>
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> 个人资料</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-speedometer2"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="profile.html">
                                <i class="bi bi-person"></i> 个人资料
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="bi bi-tools"></i> 我的报修
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="bi bi-calendar-event"></i> 我的活动
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="bi bi-chat-dots"></i> 消息中心
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="bi bi-gear"></i> 账户设置
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- 主要内容 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">个人资料</h1>
                </div>

                <div class="row">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">基本信息</h5>
                            </div>
                            <div class="card-body">
                                <form id="profileForm">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">用户名</label>
                                        <input type="text" class="form-control" id="username" value="resident" disabled>
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">邮箱</label>
                                        <input type="email" class="form-control" id="email" value="resident@smartcommunity.com">
                                    </div>
                                    <div class="mb-3">
                                        <label for="phone" class="form-label">手机号</label>
                                        <input type="tel" class="form-control" id="phone" value="13800138002">
                                    </div>
                                    <div class="mb-3">
                                        <label for="realName" class="form-label">真实姓名</label>
                                        <input type="text" class="form-control" id="realName" value="张三">
                                    </div>
                                    <div class="mb-3">
                                        <label for="idCard" class="form-label">身份证号</label>
                                        <input type="text" class="form-control" id="idCard" value="">
                                    </div>
                                    <div class="mb-3">
                                        <label for="apartmentNumber" class="form-label">房号</label>
                                        <input type="text" class="form-control" id="apartmentNumber" value="1栋101室">
                                    </div>
                                    <div class="mb-3">
                                        <label for="role" class="form-label">用户角色</label>
                                        <input type="text" class="form-control" id="role" value="居民" disabled>
                                    </div>
                                    <button type="submit" class="btn btn-primary">保存更改</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">头像设置</h5>
                            </div>
                            <div class="card-body text-center">
                                <img src="https://via.placeholder.com/150" class="rounded-circle mb-3" alt="用户头像" id="avatarPreview">
                                <div class="mb-3">
                                    <label for="avatarUpload" class="form-label">上传新头像</label>
                                    <input class="form-control" type="file" id="avatarUpload">
                                </div>
                                <button class="btn btn-outline-primary" id="uploadAvatarBtn">上传头像</button>
                            </div>
                        </div>
                        
                        <div class="card mt-4">
                            <div class="card-header">
                                <h5 class="card-title mb-0">账户状态</h5>
                            </div>
                            <div class="card-body">
                                <p><strong>账户状态：</strong> <span class="text-success">已激活</span></p>
                                <p><strong>注册时间：</strong> 2023-04-01 10:30:00</p>
                                <p><strong>最后登录：</strong> 2023-04-15 14:20:00</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 模拟用户信息
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('userName').textContent = 'resident';
        });

        // 表单提交处理
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const realName = document.getElementById('realName').value;
            const idCard = document.getElementById('idCard').value;
            const apartmentNumber = document.getElementById('apartmentNumber').value;
            
            // 这里应该是向后端发送更新请求
            // 暂时用alert模拟
            alert('个人信息更新功能将在后续版本中实现\\n邮箱: ' + email + 
                  '\\n手机号: ' + phone + 
                  '\\n真实姓名: ' + realName +
                  '\\n身份证号: ' + idCard +
                  '\\n房号: ' + apartmentNumber);
        });

        // 头像预览功能
        document.getElementById('avatarUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 上传头像功能
        document.getElementById('uploadAvatarBtn').addEventListener('click', function() {
            const fileInput = document.getElementById('avatarUpload');
            if (fileInput.files.length === 0) {
                alert('请先选择要上传的头像文件');
                return;
            }
            
            // 这里应该是向后端发送文件上传请求
            // 暂时用alert模拟
            alert('头像上传功能将在后续版本中实现');
        });

        // 退出登录功能
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('确定要退出登录吗？')) {
                // 这里应该向后端发送退出登录请求
                alert('退出登录功能将在后续版本中实现');
                // window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
