<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 智能社区服务平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card mt-5">
                    <div class="card-header text-center">
                        <h3>用户注册</h3>
                        <p class="text-muted">智能社区服务平台</p>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" required>
                                <div class="form-text">用户名长度至少6位，只能包含字母、数字和下划线</div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" required>
                                <div class="form-text">密码长度至少8位，建议包含大小写字母、数字和特殊字符</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">确认密码</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">邮箱</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">手机号</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">用户角色</label>
                                <select class="form-select" id="role" required>
                                    <option value="">请选择您的角色</option>
                                    <option value="resident">居民</option>
                                    <option value="property">物业管理员</option>
                                    <option value="service">服务商</option>
                                </select>
                            </div>
                            <div class="mb-3" id="residentFields" style="display: none;">
                                <label for="realName" class="form-label">真实姓名</label>
                                <input type="text" class="form-control" id="realName">
                                <label for="apartmentNumber" class="form-label">房号</label>
                                <input type="text" class="form-control" id="apartmentNumber">
                            </div>
                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                <label class="form-check-label" for="agreeTerms">我同意<a href="#">用户协议</a>和<a href="#">隐私政策</a></label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">注册</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <p class="mb-0">已有账号？<a href="login.html">立即登录</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 根据选择的角色显示不同的字段
        document.getElementById('role').addEventListener('change', function() {
            const residentFields = document.getElementById('residentFields');
            if (this.value === 'resident') {
                residentFields.style.display = 'block';
            } else {
                residentFields.style.display = 'none';
            }
        });

        // 表单提交处理
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            
            // 验证密码一致性
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            // 这里应该是向后端发送注册请求
            // 暂时用alert模拟
            alert('注册功能将在后续版本中实现\\n用户名: ' + username + 
                  '\\n邮箱: ' + email + 
                  '\\n手机号: ' + phone + 
                  '\\n角色: ' + role);
            
            // 模拟注册成功后跳转
            // window.location.href = 'login.html';
        });
    </script>
</body>
</html>
